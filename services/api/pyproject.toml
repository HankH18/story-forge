[project]
name = "storyforge-api"
version = "0.1.0"
description = "Story Forge API — decodable story generation with a machine-verified guarantee"
# §3 requires Python 3.12. The build machine's system python3 is 3.9.7, so this
# is pinned rather than assumed (see docs/DEVIATIONS.md 0.2).
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # [asyncio] pulls greenlet, which SQLAlchemy's async engine requires at runtime.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storyforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deterministic test ordering; the decoder's determinism property test (§5.7)
# additionally pins PYTHONHASHSEED explicitly in a subprocess.
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
