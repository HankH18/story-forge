# Local dev parity for §3: Postgres 16. The API and web run on the host via
# `make dev` — only stateful infra is containerised at this phase.
services:
  db:
    image: postgres:16-alpine
    container_name: storyforge-db
    environment:
      POSTGRES_USER: storyforge
      POSTGRES_PASSWORD: storyforge
      POSTGRES_DB: storyforge
    ports:
      - "5433:5432"  # 5433 on the host to avoid colliding with a local PG install
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `make dev` blocks on this before starting the API, so migrations
      # never race an unready socket.
      test: ["CMD-SHELL", "pg_isready -U storyforge -d storyforge"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
